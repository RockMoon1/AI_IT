# Gitleaks configuration: extends the default ruleset and adds project patterns.
title = "AI_IT secret scanning"

[extend]
useDefault = true

[[rules]]
id = "aiit-console-private-key-file"
description = "AI_IT private key material"
regex = '''-----BEGIN (?:ENCRYPTED )?PRIVATE KEY-----'''

[[rules]]
id = "aiit-server-token"
description = "AI_IT LAN server token in config"
regex = '''AIIT_SERVER_TOKEN\s*=\s*['"]?[A-Za-z0-9+/=_-]{24,}'''

[allowlist]
description = "Documentation placeholders"
paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
  '''tests/test_redact\.py$''',
  '''tests/fixtures/redaction/.*''',
]
regexes = [
  '''sk-ant-\.\.\.''',
  '''change-me''',
  '''generate-a-long-random-string''',
]
