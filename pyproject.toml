[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiit"
version = "0.1.0"
description = "AI_IT: open source, HIPAA-minded AI IT support agent and operator console for connected and offline endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AI_IT contributors"}]
keywords = ["rmm", "it-support", "ai", "llm", "hipaa", "air-gapped", "diagnostics"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "cryptography>=42",
  "pydantic>=2.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pre-commit>=3.5", "coverage[toml]>=7.4", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
aiit-agent = "aiit.agent.cli:main"
aiit-console = "aiit.console.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["aiit"]
branch = true
parallel = true
relative_files = true

[tool.coverage.paths]
aiit = ["src/aiit", "*/src/aiit", "*\\src\\aiit", "*/site-packages/aiit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "if TYPE_CHECKING:"]

[tool.bandit]
# B404/B603: subprocess use is the product; every argv is a list, never a shell string.
skips = ["B404", "B603"]
exclude_dirs = ["tests"]
