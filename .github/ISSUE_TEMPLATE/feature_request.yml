name: Feature request
description: Propose a new capability or a change to an existing one.
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/roadmap.md` first; the feature may already be planned, in which case a comment on the roadmap item is more useful than a new issue. Requests that would add a runtime dependency or send more data to a third party need the extra sections below filled in (see `GOVERNANCE.md`, section 3).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like AI_IT to do? Command-line sketches and example output are welcome. Use placeholders instead of real hostnames or identifiers.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collectors (what the agent gathers)
        - Redaction
        - Planner / prompt
        - Policy engine / executor
        - Console CLI / UX
        - LAN mode / server
        - Audit and compliance
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including doing nothing, and why they fall short.

  - type: dropdown
    id: data_impact
    attributes:
      label: Does this change what leaves the operator machine?
      description: Features that send more data to a model, a ticketing system or any third party must be opt-in and audited.
      options:
        - "No"
        - "Yes, and I have described the data and the opt-in below"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints check
      description: |
        Say how the proposal fits these project rules, or why an exception is justified:
        - runtime dependencies stay stdlib + cryptography + pydantic
        - everything that runs on an endpoint goes through policy.evaluate and the executor
        - everything sent to a model goes through the redactor
        - must work offline on the endpoint and on Windows, macOS and Linux

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this with guidance
          required: false
