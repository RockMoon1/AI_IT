# CodeQL static analysis for the Python sources.
# Runs on every push and pull request to Main and once a week so that new
# queries shipped by GitHub are applied to unchanged code as well.
name: CodeQL

on:
  push:
    branches: ["Main"]
  pull_request:
    branches: ["Main"]
  schedule:
    # Mondays at 06:17 UTC; an odd minute avoids the top-of-hour rush.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Python is interpreted, so no autobuild step is needed: CodeQL extracts
      # the sources directly.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Keep the SARIF as an artifact (alert triage without the web UI)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
